name: Build R60i Control APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The NDK / build-tools versions must match android/app/build.gradle.kts
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.16248370"

      # Installs rust + arm64 target, JDK 21, cargo-ndk and sets ANDROID_NDK_HOME
      - name: Install build tools
        uses: ./.github/actions/install-android-build-tools
        with:
          cache: "true"
          arch: arm64-v8a

      # Release builds are signed with a throw-away key generated on the fly, so the APK is installable.
      # To keep updating the same install, add your own keystore as repository secrets (see README-R60i.md).
      - name: Create signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/r60i.jks"
            PASS="$KEYSTORE_PASSWORD"
          else
            PASS="r60icontrol"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/r60i.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias r60i -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=R60i Control"
          fi
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/r60i.jks
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=r60i
          PROPS
          sed -i 's/^ *//' keystore.properties

      - name: Build arm64 release APK
        working-directory: android
        run: ./gradlew assembleArm64-v8aRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/R60i-Control.apk \;
          ls -lh build-output

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: R60i-Control-apk
          path: build-output/R60i-Control.apk
